name: Deploy to EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Write server environment
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          APP_HOST: ${{ vars.APP_HOST }}
          # Search traffic and Google Ads estimates; off until both are set.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # Alert and weekly emails, sent through Resend; off until the key is set.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          # Competitor ads from the Meta, TikTok and Google ad libraries; off until set.
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          # Where competitors' visits come from (Similarweb figures via Apify); off until set.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Keyword ideas, written by Claude; off until set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pictures for blog articles, made by OpenAI; off until set.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Sharing articles to Facebook, Instagram and TikTok; each off until its pair is set.
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_CONFIG_ID: ${{ secrets.META_CONFIG_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          # "meta,tiktok" once each network has approved the app; until then only our own stores can connect.
          SOCIAL_APPROVED: ${{ vars.SOCIAL_APPROVED }}
          # The App Store listing, once it's live: the landing page then says Install instead of the waitlist.
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
        run: |
          scopes=$(sed -n 's/^scopes = "\(.*\)"/\1/p' shopify.app.toml)
          {
            echo "SHOPIFY_API_KEY=$SHOPIFY_API_KEY"
            echo "SHOPIFY_API_SECRET=$SHOPIFY_API_SECRET"
            echo "SHOPIFY_APP_URL=https://$APP_HOST"
            echo "SCOPES=$scopes"
            echo "APP_HOST=$APP_HOST"
            echo "DATAFORSEO_LOGIN=$DATAFORSEO_LOGIN"
            echo "DATAFORSEO_PASSWORD=$DATAFORSEO_PASSWORD"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "EMAIL_FROM=$EMAIL_FROM"
            echo "SCRAPECREATORS_API_KEY=$SCRAPECREATORS_API_KEY"
            echo "APIFY_TOKEN=$APIFY_TOKEN"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "META_APP_ID=$META_APP_ID"
            echo "META_APP_SECRET=$META_APP_SECRET"
            echo "META_CONFIG_ID=$META_CONFIG_ID"
            echo "TIKTOK_CLIENT_KEY=$TIKTOK_CLIENT_KEY"
            echo "TIKTOK_CLIENT_SECRET=$TIKTOK_CLIENT_SECRET"
            echo "SOCIAL_APPROVED=$SOCIAL_APPROVED"
            echo "APP_STORE_URL=$APP_STORE_URL"
          } > deploy/.env

      # The private, free copy for 7fa72e-da.myshopify.com runs beside the
      # public app once its app exists (a client ID in
      # shopify.app.dss.toml) and its secret is set. It shares the
      # public app's data keys; only its Shopify app and address differ.
      - name: Write private copy environment
        env:
          SHOPIFY_DSS_API_SECRET: ${{ secrets.SHOPIFY_DSS_API_SECRET }}
        run: |
          own_id=$(sed -n 's/^client_id = "\(.*\)"/\1/p' shopify.app.dss.toml)
          own_url=$(sed -n 's/^application_url = "\(.*\)"/\1/p' shopify.app.dss.toml)
          own_host=${own_url#https://}
          : > deploy/Caddyfile.dss
          : > deploy/.env.dss
          if [ -n "$SHOPIFY_DSS_API_SECRET" ] && [ "$own_id" != REPLACE_WITH_DSS_CLIENT_ID ]; then
            scopes=$(sed -n 's/^scopes = "\(.*\)"/\1/p' shopify.app.dss.toml)
            {
              grep -vE '^(SHOPIFY_API_KEY|SHOPIFY_API_SECRET|SHOPIFY_APP_URL|SCOPES|APP_HOST|APP_STORE_URL)=' deploy/.env
              echo "SHOPIFY_API_KEY=$own_id"
              echo "SHOPIFY_API_SECRET=$SHOPIFY_DSS_API_SECRET"
              echo "SHOPIFY_APP_URL=$own_url"
              echo "SCOPES=$scopes"
              # Every page free, as for Colourmedia's own stores.
              echo "OWNER_SHOPS=7fa72e-da.myshopify.com"
            } > deploy/.env.dss
            printf '%s {\n\treverse_proxy dss:3000\n}\n' "$own_host" > deploy/Caddyfile.dss
            echo "DSS_PROFILE=--profile dss" >> "$GITHUB_ENV"
            echo "DSS_HOST=$own_host" >> "$GITHUB_ENV"
          else
            echo "Private copy not set up yet; deploying the public app only."
          fi

      # Build here rather than on the small EC2 instance, reusing CI's layer cache.
      # BuildKit from AWS's public mirror: Docker Hub times out or rate-limits
      # the shared runners.
      # That mirror throttles the shared runners now and then ("Rate
      # exceeded"), which setup-buildx doesn't retry, so pull it here first.
      - name: Pull BuildKit
        # Falls back to Docker Hub's copy (tagged with the mirror's name, so
        # setup-buildx uses it) when the mirror keeps refusing.
        run: |
          img=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
          for i in 1 2 3 4 5 6 7 8; do
            docker pull -q "$img" && exit 0
            if [ $((i % 2)) = 0 ] && docker pull -q moby/buildkit:buildx-stable-1; then
              docker tag moby/buildkit:buildx-stable-1 "$img" && exit 0
            fi
            sleep $((i * 8))
          done
          exit 1
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: similarwise:latest
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Load on server and restart
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DSS_PROFILE: ${{ env.DSS_PROFILE }}
        run: |
          mkdir -p ~/.ssh
          # Keys copied on Windows carry CRLF line endings, which OpenSSH rejects.
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          ssh-keygen -y -f ~/.ssh/ec2 > /dev/null || {
            echo "::error::EC2_SSH_KEY is not a valid private key. Paste the whole .pem file, including the BEGIN and END lines."
            exit 1
          }
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh_ec2() { ssh -i ~/.ssh/ec2 "ubuntu@$EC2_HOST" "$@"; }

          docker save similarwise:latest | gzip -1 | ssh_ec2 'gunzip | docker load'
          tar czf - deploy | ssh_ec2 "DSS_PROFILE='$DSS_PROFILE'" '
            set -e
            rm -rf /opt/similarwise/src.new && mkdir -p /opt/similarwise/src.new
            tar xzf - -C /opt/similarwise/src.new
            rm -rf /opt/similarwise/src && mv /opt/similarwise/src.new /opt/similarwise/src
            cd /opt/similarwise/src/deploy && docker compose $DSS_PROFILE up -d --remove-orphans
            # The Caddyfiles are replaced on each deploy, so restart Caddy to read the new ones.
            docker compose $DSS_PROFILE up -d --force-recreate --no-deps caddy
            docker image prune -f'

      # Caddy may need a minute to get the certificate after an address change.
      - name: Check the app answers over HTTPS
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          why() {
            ip=$(getent ahostsv4 "$1" | awk 'NR==1{print $1}')
            server=$(getent ahostsv4 "$EC2_HOST" | awk 'NR==1{print $1}')
            if [ -z "$ip" ]; then echo "$1 has no DNS A record yet."
            elif [ "$ip" != "$server" ]; then echo "$1 points at $ip, not the server."
            else echo "$1 points at the server. Caddy's recent log:"
              ssh -i ~/.ssh/ec2 "ubuntu@$EC2_HOST" 'cd /opt/similarwise/src/deploy && docker compose logs --tail 30 caddy'
            fi
          }
          for host in $APP_HOST $DSS_HOST; do
            ok=
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "https://$host/" || true)
              echo "https://$host/ answered $code"
              case "$code" in 2*|3*) ok=1; break ;; esac
              sleep 10
            done
            [ -n "$ok" ] || { why "$host"; echo "::error::https://$host/ isn't answering."; exit 1; }
          done
